_target_: diffusion_policy.workspace.mod_train_diffusion_transformer_lowdim_workspace.TrainDiffusionTransformerLowdimWorkspace

# ====== 只需要在这里修改维度 ======
action_dim: 1
obs_dim: 17
# ===================================

task:
  # 低维任务也可以带 action_dim/obs_dim，方便 task 内部用
  action_dim: ${action_dim}
  obs_dim: ${obs_dim}

  dataset:
    _target_: diffusion_policy.dataset.blast_furnace_dataset.BlastFurnaceLowdimDataset
    zarr_path: data/furnace/17_1_bf_replay.zarr   # 你生成的 ReplayBuffer 格式 zarr 路径
    horizon: 32
    pad_before: 1
    pad_after: 7
    seed: 42
    val_episodes:
      - 4
    max_train_episodes: null

  env_runner:
    _target_: diffusion_policy.env_runner.dummy_lowdim_runner.DummyLowdimRunner

  image_shape: null
  name: blast_furnace_lowdim
  shape_meta:
    action:
      shape:
        - ${action_dim}
    obs:
      obs:
        shape:
          - ${obs_dim}
        type: low_dim

task_name: blast_furnace_lowdim

pred_action_steps_only: false

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-val_action_mse_error={val_action_mse_error:.4f}.ckpt
    k: 5
    mode: min
    monitor_key: val_action_mse_error

dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

exp_name: default
horizon: 32

keypoint_visible_rate: 1.0

logging:
  group: null
  id: null
  mode: online
  name: si_pred_val_4_transformer_lowdim_bf
  project: bf_diffusion_policy_experiment
  resume: true
  tags:
    - train_diffusion_transformer_lowdim
    - blast_furnace_lowdim
    - default

multi_run:
  run_dir: data/outputs/2023.01.16/20.20.06_train_diffusion_transformer_lowdim_bf
  wandb_name_base: 2023.01.16-20.20.06_train_diffusion_transformer_lowdim_bf

n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 24

name: train_diffusion_transformer_lowdim

# 低维策略常用设置
obs_as_cond: true
past_action_visible: false

optimizer:
  betas:
    - 0.95
    - 0.999
  learning_rate: 0.0001
  weight_decay: 1.0e-06

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_lowdim_policy.DiffusionTransformerLowdimPolicy
  action_dim: ${action_dim}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  model:
    _target_: diffusion_policy.model.diffusion.transformer_for_diffusion.TransformerForDiffusion
    input_dim: ${eval:'${action_dim} if ${obs_as_cond} else ${obs_dim} + ${action_dim}'}
    output_dim: ${policy.model.input_dim}
    horizon: ${horizon}
    n_obs_steps: ${n_obs_steps}
    cond_dim: ${eval:'${obs_dim} if ${obs_as_cond} else 0'}
    
    n_layer: 8
    n_head: 4
    n_emb: 256
    p_drop_emb: 0.0
    p_drop_attn: 0.3
    
    causal_attn: true
    time_as_cond: true
    obs_as_cond: ${obs_as_cond}
    n_cond_layers: 0

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small

  num_inference_steps: 100
  obs_dim: ${obs_dim}
  obs_as_cond: ${obs_as_cond}
  pred_action_steps_only: ${pred_action_steps_only}

# 这里的 shape_meta 是给 env_runner / 可视化用的，lowdim 不一定强依赖，
# 但保持一个简单的一致定义
shape_meta:
  action:
    shape:
      - ${action_dim}
  obs:
    obs:                   # 统一叫 obs，一个18 维向量
      shape:
        - ${obs_dim}
      type: low_dim

training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 1200
  resume: true
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1

val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
